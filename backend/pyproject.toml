[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501", "E701", "E702"]  # B008: FastAPI Depends(); E70x: terse one-line guards

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"app/models/*" = ["F821"]  # SQLAlchemy string forward references
